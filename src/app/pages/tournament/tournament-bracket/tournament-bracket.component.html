<div class="bracket" [style.--rounds]="columns().length">
  @for (col of columns(); track col.round) {
    <div class="round" [class.first]="col.round === 0">
      <h3 class="round-label">{{ col.label }}</h3>
      <div class="round-body">
        @for (group of col.groups; track $index) {
          <div class="group" [class.paired]="group.matches.length === 2">
            @for (cell of group.matches; track cell.index) {
              @let m = cell.match;
              <div class="cell">
                <div
                  class="match"
                  [class.mine]="isPlayerMatch(m)"
                  [class.next]="nextKey() === col.round + ':' + cell.index"
                >
                  @for (id of [m.a, m.b]; track $index) {
                    @let e = entrant(id);
                    <button
                      type="button"
                      class="slot"
                      [class.empty]="!e"
                      [class.player]="id === playerId"
                      [class.winner]="m.winner !== null && m.winner === id"
                      [class.loser]="m.winner !== null && m.winner !== id"
                      [disabled]="!e"
                      (click)="select(id)"
                    >
                      @if (e) {
                        <img class="slot-avatar" [src]="avatarPath(e.trainerId)" alt="" width="26" height="26" />
                        <span class="slot-name">{{ e.name }}</span>
                      } @else {
                        <span class="slot-name">—</span>
                      }
                    </button>
                  }
                </div>
              </div>
            }
          </div>
        }
      </div>
    </div>
  }
</div>
