<ion-content class="ion-padding">
  <header class="page-head">
    <a class="back-link" routerLink="/team-select">‹ Zurück</a>
    <h1>Einstellungen</h1>
  </header>

  <section class="setting">
    <h2>Trainer-Avatar</h2>
    <p class="hint">Wähle das Bild, das deinen Trainer repräsentiert.</p>

    <div class="avatar-grid">
      @for (avatar of avatars; track avatar.id) {
        <button
          type="button"
          class="avatar-cell"
          [class.selected]="avatar.id === selected()"
          [attr.aria-pressed]="avatar.id === selected()"
          [title]="avatar.label"
          (click)="choose(avatar.id)"
        >
          <img
            [src]="avatarPath(avatar.id)"
            [alt]="avatar.label"
            width="80"
            height="80"
            loading="lazy"
          />
          <span class="avatar-label">{{ avatar.label }}</span>
        </button>
      }
    </div>
  </section>
</ion-content>
